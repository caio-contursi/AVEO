map $http_upgrade $rpc_connection {
    default upgrade;
    '' close;
}
# Do not record request arguments, Referer, or other credential-bearing headers.
log_format web_safe '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    listen 127.0.0.1:8090;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log web_safe;
    set $rpc_backend 127.0.0.1:8787;
    location = /rpc {
        # Forward only this fixed URI, without request query arguments.
        proxy_pass http://$rpc_backend/rpc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rpc_connection;
        proxy_set_header Host $proxy_host;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        client_max_body_size 1m;
        access_log off;
        # Nginx error messages may include the original query string.
        error_log /dev/null;
    }
    location = /rpc-ws {
        proxy_pass http://$rpc_backend/rpc-ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rpc_connection;
        proxy_set_header Host $proxy_host;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        client_max_body_size 1m;
        access_log off;
        error_log /dev/null;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /deployment.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
